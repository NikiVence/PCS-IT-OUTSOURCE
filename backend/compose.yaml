name: it-outsource-kr3

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_outsource_kr3}
      POSTGRES_USER: ${POSTGRES_USER:-it_outsource_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create backend/.env from backend/.env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
