name: it-outsource

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_outsource}
      POSTGRES_USER: ${POSTGRES_USER:-it_outsource_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-it_outsource_app} -d ${POSTGRES_DB:-it_outsource}"]
      interval: 5s
       timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
